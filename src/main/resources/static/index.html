<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ITM Ride - Carpooling Universitario</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: Arial, sans-serif; background: #f0f2f5; }

        header {
            background: #1a73e8;
            color: white;
            padding: 16px 32px;
            display: flex;
            align-items: center;
            gap: 12px;
        }
        header h1 { font-size: 22px; }
        header p { font-size: 13px; opacity: 0.85; }

        nav {
            background: white;
            display: flex;
            gap: 8px;
            padding: 12px 32px;
            border-bottom: 1px solid #ddd;
        }
        nav button {
            padding: 8px 20px;
            border: none;
            border-radius: 20px;
            cursor: pointer;
            font-size: 14px;
            background: #f0f2f5;
            color: #333;
            transition: all 0.2s;
        }
        nav button.active {
            background: #1a73e8;
            color: white;
        }

        .container { max-width: 900px; margin: 32px auto; padding: 0 16px; }

        .section { display: none; }
        .section.active { display: block; }

        .card {
            background: white;
            border-radius: 12px;
            padding: 24px;
            margin-bottom: 20px;
            box-shadow: 0 1px 4px rgba(0,0,0,0.1);
        }
        .card h2 { font-size: 18px; margin-bottom: 16px; color: #1a73e8; }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 16px;
        }
        .form-group { display: flex; flex-direction: column; gap: 4px; }
        .form-group label { font-size: 13px; color: #555; font-weight: bold; }
        .form-group input, .form-group select {
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 14px;
            outline: none;
            transition: border 0.2s;
        }
        .form-group input:focus, .form-group select:focus {
            border-color: #1a73e8;
        }

        .btn {
            padding: 10px 24px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            font-weight: bold;
            transition: opacity 0.2s;
        }
        .btn:hover { opacity: 0.85; }
        .btn-primary { background: #1a73e8; color: white; }
        .btn-danger { background: #e53935; color: white; }
        .btn-warning { background: #fb8c00; color: white; }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 14px;
        }
        th {
            background: #f0f2f5;
            padding: 10px 12px;
            text-align: left;
            font-size: 13px;
            color: #555;
        }
        td { padding: 10px 12px; border-bottom: 1px solid #f0f2f5; }
        tr:hover { background: #fafafa; }

        .badge {
            padding: 3px 10px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: bold;
        }
        .badge-conductor { background: #e8f5e9; color: #2e7d32; }
        .badge-pasajero { background: #e3f2fd; color: #1565c0; }

        .alert {
            padding: 12px 16px;
            border-radius: 8px;
            margin-bottom: 16px;
            font-size: 14px;
            display: none;
        }
        .alert-success { background: #e8f5e9; color: #2e7d32; border-left: 4px solid #2e7d32; }
        .alert-error { background: #ffebee; color: #c62828; border-left: 4px solid #c62828; }

        .actions { display: flex; gap: 8px; }
    </style>
</head>
<body>

<header>
    <div>
        <h1>🚌 ITM Ride</h1>
        <p>Carpooling Universitario — ITM</p>
    </div>
</header>

<nav>
    <button class="active" onclick="showSection('usuarios')">👤 Usuarios</button>
    <button onclick="showSection('viajes')">🗺️ Viajes</button>
</nav>

<div class="container">

    <!-- SECCIÓN USUARIOS -->
    <div id="sec-usuarios" class="section active">

        <div class="card">
            <h2>➕ Registrar Usuario</h2>
            <div id="alert-usuario" class="alert"></div>
            <div class="form-grid">
                <div class="form-group">
                    <label>Nombre completo</label>
                    <input type="text" id="u-nombre" placeholder="Ej: Juan Pérez">
                </div>
                <div class="form-group">
                    <label>Correo ITM</label>
                    <input type="email" id="u-correo" placeholder="Ej: juan@itm.edu.co">
                </div>
                <div class="form-group">
                    <label>Teléfono</label>
                    <input type="text" id="u-telefono" placeholder="Ej: 3001234567">
                </div>
                <div class="form-group">
                    <label>Barrio</label>
                    <input type="text" id="u-barrio" placeholder="Ej: Laureles">
                </div>
                <div class="form-group">
                    <label>Tipo</label>
                    <select id="u-tipo">
                        <option value="PASAJERO">Pasajero</option>
                        <option value="CONDUCTOR">Conductor</option>
                    </select>
                </div>
            </div>
            <button class="btn btn-primary" onclick="crearUsuario()">Registrar</button>
        </div>

        <div class="card">
            <h2>👥 Usuarios Registrados</h2>
            <table>
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Nombre</th>
                        <th>Correo</th>
                        <th>Teléfono</th>
                        <th>Barrio</th>
                        <th>Tipo</th>
                        <th>Acciones</th>
                    </tr>
                </thead>
                <tbody id="tabla-usuarios">
                    <tr><td colspan="7" style="text-align:center;color:#999">Cargando...</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <!-- SECCIÓN VIAJES -->
    <div id="sec-viajes" class="section">

        <div class="card">
            <h2>➕ Publicar Viaje</h2>
            <div id="alert-viaje" class="alert"></div>
            <div class="form-grid">
                <div class="form-group">
                    <label>Origen</label>
                    <input type="text" id="v-origen" placeholder="Ej: Laureles">
                </div>
                <div class="form-group">
                    <label>Destino</label>
                    <input type="text" id="v-destino" placeholder="Ej: ITM Fraternidad">
                </div>
                <div class="form-group">
                    <label>Fecha</label>
                    <input type="date" id="v-fecha">
                </div>
                <div class="form-group">
                    <label>Hora</label>
                    <input type="time" id="v-hora">
                </div>
                <div class="form-group">
                    <label>Cupos disponibles</label>
                    <input type="number" id="v-cupos" placeholder="Ej: 3" min="1">
                </div>
                <div class="form-group">
                    <label>ID del Conductor</label>
                    <input type="number" id="v-conductor" placeholder="Ej: 1">
                </div>
            </div>
            <button class="btn btn-primary" onclick="crearViaje()">Publicar Viaje</button>
        </div>

        <div class="card">
            <h2>🗺️ Viajes Disponibles</h2>
            <table>
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Origen</th>
                        <th>Destino</th>
                        <th>Fecha</th>
                        <th>Hora</th>
                        <th>Cupos</th>
                        <th>Conductor ID</th>
                        <th>Acciones</th>
                    </tr>
                </thead>
                <tbody id="tabla-viajes">
                    <tr><td colspan="8" style="text-align:center;color:#999">Cargando...</td></tr>
                </tbody>
            </table>
        </div>
    </div>

</div>

<script>
const API = 'http://localhost:8080/api';

function showSection(name) {
    document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
    document.querySelectorAll('nav button').forEach(b => b.classList.remove('active'));
    document.getElementById('sec-' + name).classList.add('active');
    event.target.classList.add('active');
    if (name === 'usuarios') cargarUsuarios();
    if (name === 'viajes') cargarViajes();
}

function showAlert(id, msg, type) {
    const el = document.getElementById(id);
    el.textContent = msg;
    el.className = 'alert alert-' + type;
    el.style.display = 'block';
    setTimeout(() => el.style.display = 'none', 3000);
}

// ── USUARIOS ──
async function cargarUsuarios() {
    const res = await fetch(API + '/usuarios');
    const data = await res.json();
    const tbody = document.getElementById('tabla-usuarios');
    if (data.length === 0) {
        tbody.innerHTML = '<tr><td colspan="7" style="text-align:center;color:#999">No hay usuarios registrados</td></tr>';
        return;
    }
    tbody.innerHTML = data.map(u => `
        <tr>
            <td>${u.id}</td>
            <td>${u.nombre}</td>
            <td>${u.correo}</td>
            <td>${u.telefono}</td>
            <td>${u.barrio}</td>
            <td><span class="badge badge-${u.tipo.toLowerCase()}">${u.tipo}</span></td>
            <td class="actions">
                <button class="btn btn-warning" onclick="editarUsuario(${u.id})">Editar</button>
                <button class="btn btn-danger" onclick="eliminarUsuario(${u.id})">Eliminar</button>
            </td>
        </tr>
    `).join('');
}

async function crearUsuario() {
    const usuario = {
        nombre: document.getElementById('u-nombre').value,
        correo: document.getElementById('u-correo').value,
        telefono: document.getElementById('u-telefono').value,
        barrio: document.getElementById('u-barrio').value,
        tipo: document.getElementById('u-tipo').value
    };
    if (!usuario.nombre || !usuario.correo) {
        showAlert('alert-usuario', 'Por favor completa nombre y correo', 'error');
        return;
    }
    const res = await fetch(API + '/usuarios', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(usuario)
    });
    if (res.ok) {
        showAlert('alert-usuario', 'Usuario registrado exitosamente', 'success');
        document.getElementById('u-nombre').value = '';
        document.getElementById('u-correo').value = '';
        document.getElementById('u-telefono').value = '';
        document.getElementById('u-barrio').value = '';
        cargarUsuarios();
    } else {
        showAlert('alert-usuario', 'Error al registrar usuario', 'error');
    }
}

async function eliminarUsuario(id) {
    if (!confirm('¿Seguro que deseas eliminar este usuario?')) return;
    await fetch(API + '/usuarios/' + id, { method: 'DELETE' });
    showAlert('alert-usuario', 'Usuario eliminado', 'success');
    cargarUsuarios();
}

async function editarUsuario(id) {
    const nombre = prompt('Nuevo nombre:');
    if (!nombre) return;
    const correo = prompt('Nuevo correo:');
    const telefono = prompt('Nuevo teléfono:');
    const barrio = prompt('Nuevo barrio:');
    const tipo = prompt('Tipo (PASAJERO/CONDUCTOR):');
    await fetch(API + '/usuarios/' + id, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ nombre, correo, telefono, barrio, tipo })
    });
    showAlert('alert-usuario', 'Usuario actualizado', 'success');
    cargarUsuarios();
}

// ── VIAJES ──
async function cargarViajes() {
    const res = await fetch(API + '/viajes');
    const data = await res.json();
    const tbody = document.getElementById('tabla-viajes');
    if (data.length === 0) {
        tbody.innerHTML = '<tr><td colspan="8" style="text-align:center;color:#999">No hay viajes disponibles</td></tr>';
        return;
    }
    tbody.innerHTML = data.map(v => `
        <tr>
            <td>${v.id}</td>
            <td>${v.origen}</td>
            <td>${v.destino}</td>
            <td>${v.fecha}</td>
            <td>${v.hora}</td>
            <td>${v.cupos}</td>
            <td>${v.conductorId}</td>
            <td class="actions">
                <button class="btn btn-warning" onclick="editarViaje(${v.id})">Editar</button>
                <button class="btn btn-danger" onclick="eliminarViaje(${v.id})">Eliminar</button>
            </td>
        </tr>
    `).join('');
}

async function crearViaje() {
    const viaje = {
        origen: document.getElementById('v-origen').value,
        destino: document.getElementById('v-destino').value,
        fecha: document.getElementById('v-fecha').value,
        hora: document.getElementById('v-hora').value,
        cupos: parseInt(document.getElementById('v-cupos').value),
        conductorId: parseInt(document.getElementById('v-conductor').value)
    };
    if (!viaje.origen || !viaje.destino || !viaje.fecha) {
        showAlert('alert-viaje', 'Por favor completa origen, destino y fecha', 'error');
        return;
    }
    const res = await fetch(API + '/viajes', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(viaje)
    });
    if (res.ok) {
        showAlert('alert-viaje', 'Viaje publicado exitosamente', 'success');
        document.getElementById('v-origen').value = '';
        document.getElementById('v-destino').value = '';
        document.getElementById('v-fecha').value = '';
        document.getElementById('v-hora').value = '';
        document.getElementById('v-cupos').value = '';
        document.getElementById('v-conductor').value = '';
        cargarViajes();
    } else {
        showAlert('alert-viaje', 'Error al publicar viaje', 'error');
    }
}

async function eliminarViaje(id) {
    if (!confirm('¿Seguro que deseas eliminar este viaje?')) return;
    await fetch(API + '/viajes/' + id, { method: 'DELETE' });
    showAlert('alert-viaje', 'Viaje eliminado', 'success');
    cargarViajes();
}

async function editarViaje(id) {
    const origen = prompt('Nuevo origen:');
    if (!origen) return;
    const destino = prompt('Nuevo destino:');
    const fecha = prompt('Nueva fecha (YYYY-MM-DD):');
    const hora = prompt('Nueva hora (HH:MM):');
    const cupos = prompt('Nuevos cupos:');
    const conductorId = prompt('ID del conductor:');
    await fetch(API + '/viajes/' + id, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ origen, destino, fecha, hora, cupos: parseInt(cupos), conductorId: parseInt(conductorId) })
    });
    showAlert('alert-viaje', 'Viaje actualizado', 'success');
    cargarViajes();
}

cargarUsuarios();
</script>

</body>
</html>
